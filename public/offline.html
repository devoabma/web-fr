<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16213e" />
    <title>Sem conexão • Sala Livre</title>
    <!--
      HTML solto de propósito: esta é a única tela que o service worker guarda e ela precisa abrir
      com o rádio desligado, sem depender de JS do Next, de fonte remota ou de resposta da api-fr.
    -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f5f8;
        color: #18181b;
        font-family: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        width: 100%;
        max-width: 26rem;
        padding: 32px 28px;
        border: 1px solid #e4e4e7;
        border-radius: 18px;
        background: #fff;
        text-align: center;
        box-shadow: 0 1px 2px rgb(16 24 40 / 6%);
      }
      .mark { width: 56px; height: 56px; }
      h1 { margin: 20px 0 8px; font-size: 1.25rem; letter-spacing: -0.01em; }
      p { margin: 0; color: #71717a; font-size: 0.9375rem; line-height: 1.5; }
      button {
        margin-top: 24px;
        width: 100%;
        padding: 11px 16px;
        border: 0;
        border-radius: 10px;
        background: #16213e;
        color: #eef1f8;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { background: #1e2d54; }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <path d="M24 60 L24 64 A12 12 0 0 0 36 76 L64 76 A12 12 0 0 0 76 64 L76 36 A12 12 0 0 0 64 24 L36 24 A12 12 0 0 0 24 36 L24 40" stroke="#16213e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M24 40 L45 53" stroke="#c0392b" stroke-width="6" stroke-linecap="round" />
        <circle cx="45" cy="53" r="3.4" fill="#c0392b" />
      </svg>

      <h1>Você está sem conexão</h1>
      <p>O Sala Livre precisa de internet para falar com o servidor. Verifique a rede do aparelho e tente de novo.</p>

      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
